<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Редактируемый div</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef2f3, #dfe9f3);
      font-family: Arial, sans-serif;
    }

    .box {
      width: 420px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }

    #view {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      min-height: 60px;
      background: #fafafa;
      transition: 0.2s;
    }

    #view:hover {
      border-color: #4a90e2;
      background: #f5f9ff;
    }

    #editor {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #4a90e2;
      outline: none;
      font-size: 14px;
      font-family: Arial, sans-serif;
      box-shadow: 0 0 6px rgba(74,144,226,0.2);
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }

    kbd {
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 11px;
    }
  </style>
</head>

<body>

<div class="box">

  <div id="view"></div>
  <textarea id="editor" hidden></textarea>

  <div class="hint">
    <kbd>Ctrl + E</kbd> — редактировать |
    <kbd>Ctrl + S</kbd> — сохранить |
    <kbd>Esc</kbd> — отмена
  </div>

</div>

<script>
  'use strict';

  const view = document.getElementById('view');
  const editor = document.getElementById('editor');

  const savedText = localStorage.getItem('editable_text');

  if (savedText !== null) {
    view.innerHTML = savedText;
    editor.value = savedText;
  } else {
    view.innerHTML = 'Нажми Ctrl+E для редактирования';
    editor.value = view.innerHTML;
  }

  document.addEventListener('keydown', function (event) {

    if (event.ctrlKey && event.code === 'KeyE') {
      event.preventDefault();

      editor.value = view.innerHTML;

      editor.hidden = false;
      view.hidden = true;

      editor.focus();
    }

    if (event.ctrlKey && event.code === 'KeyS') {
      event.preventDefault();

      view.innerHTML = editor.value;
      localStorage.setItem('editable_text', editor.value);

      editor.hidden = true;
      view.hidden = false;
    }

    if (event.code === 'Escape') {
      if (editor.hidden) return;

      editor.hidden = true;
      view.hidden = false;

      editor.value = view.innerHTML;
    }
  });
</script>

</body>
</html>
