<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Плейсхолдер-подсказка</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
    }

    .box {
      width: 320px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #4a90e2;
      box-shadow: 0 0 6px rgba(74,144,226,0.3);
    }

    .placeholder {
      color: #0000ff;
    }

    #hint {
      margin-top: 10px;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>

<body>

  <div class="box">
    <input id="field" class="placeholder" data-placeholder="Введите что-нибудь">
    <p id="hint" hidden></p>
  </div>

  <script>
    'use strict';

    const field = document.getElementById('field');
    const hint = document.getElementById('hint');

    field.value = field.dataset.placeholder;

    field.addEventListener('focus', movePlaceholderUp);
    field.addEventListener('blur', movePlaceholderDown);

    function movePlaceholderUp() {
      if (field.value === field.dataset.placeholder) {
        field.value = '';
        field.classList.remove('placeholder');
      }

      hint.hidden = false;
      hint.innerText = field.dataset.placeholder + ':';
    }

    function movePlaceholderDown() {
      hint.hidden = true;

      if (field.value === '') {
        field.value = field.dataset.placeholder;
        field.classList.add('placeholder');
      }
    }
  </script>

</body>
</html>
